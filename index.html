<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light">
  <link rel="manifest" href="manifest.json?v=2">
  <link rel="icon" type="image/png" href="favicon.png?v=2">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="티원 탁구">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>티원 탁구동호회</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="style.css?v=11">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a href="#/" class="brand">
        <span class="logo" aria-hidden="true"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="#1a66d2"/><g transform="rotate(-18 16 14)"><rect x="14.4" y="19" width="3.2" height="7.5" rx="1.4" fill="#f3c27a"/><circle cx="16" cy="13" r="8.2" fill="#fff"/><circle cx="16" cy="13" r="7.2" fill="#ef4b4b"/></g><circle cx="13.4" cy="12.6" r="1.1" fill="#3a1220"/><circle cx="17.8" cy="12" r="1.1" fill="#3a1220"/><path d="M14.4 15 q1.3 1.1 2.6 -.2" fill="none" stroke="#3a1220" stroke-width="1" stroke-linecap="round"/><circle cx="26" cy="6.5" r="2.4" fill="#ffd27a"/></svg></span>
        <span class="brand-text"><span class="kicker">T-ONE TABLE TENNIS CLUB</span><b id="clubName">티원 탁구동호회</b></span>
      </a>
      <button id="authBtn" class="admin-link" data-act="auth">관리</button>
    </div>
  </header>
  <div id="editbar" class="editbar" hidden></div>

  <main id="view" class="wrap"><p class="empty">불러오는 중…</p></main>

  <nav class="nav" aria-label="메뉴">
    <a href="#/" data-route="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span>일정</span></a>
    <a href="#/ranking" data-route="ranking">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>
      <span>순위</span></a>
    <a href="#/photos" data-route="photos">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="2.5"/><circle cx="9" cy="10.5" r="2"/><path d="M21 16.5l-5-5-8.5 8.5"/></svg>
      <span>사진</span></a>
    <a href="#/members" data-route="members">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 14a6.5 6.5 0 0 1 3 6"/></svg>
      <span>회원</span></a>
    <a href="#/fees" data-route="fees">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6.5" width="18" height="13.5" rx="2.5"/><path d="M3 10.5h18"/><path d="M15.5 15h2.5"/><path d="M6 6.5 15 3.5l1.5 3"/></svg>
      <span>회비</span></a>

  </nav>

  <div id="modal" class="modal hidden"></div>
  <div id="toast" class="toast"></div>

  <!-- 앱을 끝내 불러오지 못하면(오래된 휴대폰·앱 안 브라우저·연결 차단) 안내를 보여 줌 -->
  <script>
    (function () {
      function help(msg) {
        if (window.__toneReady) return;
        var v = document.getElementById("view");
        if (!v || v.querySelector(".load-help")) return;
        v.innerHTML = '<section class="card load-help"><h2>화면을 불러오지 못했어요</h2><p class="hint lead">' + msg + '</p>' +
          '<button class="btn primary block" onclick="location.replace(location.pathname+\'?r=\'+Date.now()+location.hash)">새로고침</button>' +
          '<p class="hint">카카오톡에서 계속 안 열리면 화면의 <b>⋮</b>(아이폰은 아래 <b>공유</b>) 버튼 → <b>다른 브라우저로 열기</b>를 눌러 Chrome·Safari·삼성 인터넷으로 열어 주세요.</p></section>';
      }
      window.addEventListener("error", function () { setTimeout(function () { help("일시적인 오류가 생겼어요. 새로고침해 주세요."); }, 1500); });
      setTimeout(function () { help("인터넷 연결이 느리거나 이 브라우저에서 연결이 막혔을 수 있어요."); }, 15000);
    })();
  </script>
  <script type="module" src="app.js?v=11"></script>
</body>
</html>
