<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="티원 탁구">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>티원 탁구동호회</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a href="#/" class="brand">
        <span class="logo" aria-hidden="true"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="#1a66d2"/><circle cx="14" cy="14" r="7.2" fill="#fff"/><path d="M18.6 19.2l5 5" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/><circle cx="23.6" cy="8.6" r="2.6" fill="#ffd27a"/></svg></span>
        <span class="brand-text"><span class="kicker">T-ONE TABLE TENNIS CLUB</span><b id="clubName">티원 탁구동호회</b></span>
      </a>
      <button id="authBtn" class="admin-link" data-act="auth">관리</button>
    </div>
  </header>
  <div id="editbar" class="editbar" hidden></div>

  <main id="view" class="wrap"><p class="empty">불러오는 중…</p></main>

  <nav class="nav" aria-label="메뉴">
    <a href="#/" data-route="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span>일정</span></a>
    <a href="#/ranking" data-route="ranking">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>
      <span>순위</span></a>
    <a href="#/members" data-route="members">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 14a6.5 6.5 0 0 1 3 6"/></svg>
      <span>회원</span></a>
  </nav>

  <div id="modal" class="modal hidden"></div>
  <div id="toast" class="toast"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
